<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>NeoSQL MCP</title>
  <!--
    Source of plugins/neosql-mcp/.claude-plugin/icon.png (512x512, transparent corners).
    NeoSQL brand mark: a square split into five equal stripes, bars on stripes 1, 3 and 5
    (black / #467B59 / black) on a white tile, as in the NeoSQL Desktop app icon.
    The 64px stripe grid keeps the bars pixel-aligned at 16, 32, 64 and 128px.
    The light tile outline keeps the tile shape visible on white backgrounds.
    Render: headless Chrome screenshot at device scale factor 1, window 512x512,
    default background color 00000000 (transparent).
  -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="8"/>
  <rect x="96" y="96" width="320" height="64" fill="#000000"/>
  <rect x="96" y="224" width="320" height="64" fill="#467B59"/>
  <rect x="96" y="352" width="320" height="64" fill="#000000"/>
</svg>
